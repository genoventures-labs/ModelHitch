<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ModelHitch BYOK UI</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
      .msg { padding: 0.5rem 0.75rem; border-radius: 0.5rem; margin: 0.375rem 0; white-space: pre-wrap; }
      .user { background: #2563eb22; align-self: flex-end; }
      .assistant { background: #64748b22; }
      .tool { font-size: 0.8rem; color: #64748b; font-family: monospace; }
      form { display: flex; gap: 0.5rem; margin-top: 1rem; }
      input { flex: 1; padding: 0.5rem; }
      select { padding: 0.5rem; }
      .status { font-size: 0.8rem; color: #64748b; margin-top: 0.5rem; }
      .tabs { display: flex; gap: 0.5rem; margin: 1rem 0; }
      .tab { padding: 0.375rem 0.75rem; border-radius: 0.375rem; border: 1px solid #64748b66; background: transparent; cursor: pointer; }
      .tab.active { background: #2563eb22; border-color: #2563eb88; }
      .row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
